<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>紅色濾色解密器</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh; /* 動態高度，避開手機選單 */
            background-color: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            background-color: #000;
            position: absolute;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- 懸浮在底部的工具列 --- */
        .toolbar {
            position: absolute;
            bottom: 60px; /* 距離底部 60px */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* 兩個按鈕的間距 */
            z-index: 20;
            pointer-events: none; /* 讓畫面空白處可以穿透點擊 */
        }

        .tool-btn {
            pointer-events: auto; /* 讓按鈕本身可以被點擊 */
            padding: 14px 24px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid white;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        #btn-red { background-color: #ff0000; color: white; }
        #btn-none { background-color: rgba(255, 255, 255, 0.9); color: #333; }
        
        .tool-btn:active { transform: scale(0.92); }

        /* --- 強制鎖死畫面的權限警告層 --- */
        #permission-overlay {
            display: none; /* 預設隱藏，抓不到相機才顯示 */
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: rgba(20, 20, 20, 0.98);
            z-index: 999; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #permission-overlay h2 {
            margin-top: 0;
            color: #ff4444;
            font-size: 24px;
        }

        #permission-overlay p {
            line-height: 1.6;
            font-size: 16px;
            color: #ccc;
            margin-bottom: 30px;
        }

        #retry-btn {
            padding: 14px 24px;
            font-size: 18px;
            font-weight: bold;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        #retry-btn:active {
            transform: scale(0.95);
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <!-- 只有兩個按鈕的控制列 -->
    <div class="toolbar">
        <button id="btn-red" class="tool-btn">🔴 紅濾鏡</button>
        <button id="btn-none" class="tool-btn">⚪ 關閉</button>
    </div>

    <!-- 權限被拒絕時，強制覆蓋全螢幕的警告層 -->
    <div id="permission-overlay">
        <h2>⚠️ 必須開啟相機</h2>
        <p>
            這個遊戲需要使用您的相機來解密！<br>您剛剛可能不小心拒絕了權限。<br><br>
            請點擊網址列旁邊的<strong>「大小 Aa」</strong>或<strong>「鎖頭圖示」</strong><br>
            允許相機權限後，再點擊下方按鈕。
        </p>
        <button id="retry-btn">我已允許，重新載入</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const permissionOverlay = document.getElementById('permission-overlay');
        const retryBtn = document.getElementById('retry-btn');
        
        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.muted = true; // 確保手機允許自動播放

        // 預設狀態為「紅濾鏡」
        let currentFilter = 'red';

        // 綁定兩顆按鈕的點擊事件
        document.getElementById('btn-red').onclick = () => currentFilter = 'red';
        document.getElementById('btn-none').onclick = () => currentFilter = 'none';

        // 確保畫布解析度與視窗相符
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 啟動相機的函數
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    video.srcObject = stream;
                    permissionOverlay.style.display = 'none'; // 成功取得權限，隱藏警告層
                    
                    video.onloadedmetadata = () => {
                        video.play().then(() => {
                            requestAnimationFrame(renderLoop);
                        }).catch(e => console.error("播放被阻擋", e));
                    };
                })
                .catch(err => {
                    console.error("無法存取相機", err);
                    // 抓不到相機，立刻顯示滿版警告畫面
                    permissionOverlay.style.display = 'flex';
                });
        }

        // 網頁一打開就立刻要求權限
        startCamera();

        // 玩家點擊重新載入按鈕
        retryBtn.addEventListener('click', () => {
            window.location.reload(); 
        });

        // 畫面渲染迴圈
        function renderLoop() {
            if (video.readyState >= 2 && !video.paused) {
                // 1. 畫上原始相機畫面
                ctx.globalCompositeOperation = 'source-over';

                const canvasRatio = canvas.width / canvas.height;
                const videoRatio = video.videoWidth / video.videoHeight;
                let drawWidth, drawHeight, startX, startY;

                if (canvasRatio > videoRatio) {
                    drawWidth = canvas.width;
                    drawHeight = canvas.width / videoRatio;
                    startX = 0;
                    startY = (canvas.height - drawHeight) / 2;
                } else {
                    drawWidth = canvas.height * videoRatio;
                    drawHeight = canvas.height;
                    startX = (canvas.width - drawWidth) / 2;
                    startY = 0;
                }

                ctx.drawImage(video, startX, startY, drawWidth, drawHeight);

                // 2. 判斷目前選擇的濾鏡，套用效果
                if (currentFilter === 'red') {
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.fillStyle = 'rgb(255, 0, 0)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(renderLoop);
        }
        
        // 點擊畫面任意處確保影片播放 (防呆機制)
        document.body.addEventListener('click', () => {
            if (video.paused && permissionOverlay.style.display === 'none') {
                video.play();
            }
        });
    </script>

</body>
</html>
