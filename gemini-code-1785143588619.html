<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>相機即時濾色 - 懸浮按鈕版</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            /* 使用 dvh (動態視窗高度)，能完美避開手機瀏覽器的上下選單干擾 */
            height: 100dvh; 
            background-color: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }

        .canvas-container {
            width: 100%;
            height: 100%; /* 讓相機填滿整個螢幕 */
            background-color: #222;
            position: absolute;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- 修改這裡：變成懸浮在底部的工具列 --- */
        .toolbar {
            position: absolute;
            bottom: 60px; /* 距離底部 60px，您可以隨意把數字調大(往上)或調小(往下) */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px; /* 按鈕之間的間距 */
            z-index: 20;
            pointer-events: none; /* 讓空白處可以穿透點擊 */
        }

        .tool-btn {
            pointer-events: auto; /* 讓按鈕本身可以被點擊 */
            padding: 14px 18px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid white; /* 加上白邊讓按鈕更明顯 */
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); /* 加深陰影 */
        }

        #btn-red { background-color: #ff0000; color: white; }
        #btn-blue { background-color: #0000ff; color: white; }
        #btn-none { background-color: rgba(255, 255, 255, 0.8); color: #333; border: 2px solid #ccc; }
        
        .tool-btn:active { transform: scale(0.92); }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <!-- 控制按鈕 -->
    <div class="toolbar">
        <button id="btn-red" class="tool-btn">🔴 紅濾鏡</button>
        <button id="btn-blue" class="tool-btn">🔵 藍濾鏡</button>
        <button id="btn-none" class="tool-btn">⚪ 關閉</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.muted = true; 

        let currentFilter = 'none';

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play().then(() => {
                        requestAnimationFrame(renderLoop);
                    }).catch(e => {
                        console.error("播放被阻擋", e);
                    });
                };
            })
            .catch(err => {
                console.error("無法存取相機", err);
                alert("請允許網頁存取相機權限喔！");
            });

        function renderLoop() {
            if (video.readyState >= 2 && !video.paused) {
                ctx.globalCompositeOperation = 'source-over';

                const canvasRatio = canvas.width / canvas.height;
                const videoRatio = video.videoWidth / video.videoHeight;
                let drawWidth, drawHeight, startX, startY;

                if (canvasRatio > videoRatio) {
                    drawWidth = canvas.width;
                    drawHeight = canvas.width / videoRatio;
                    startX = 0;
                    startY = (canvas.height - drawHeight) / 2;
                } else {
                    drawWidth = canvas.height * videoRatio;
                    drawHeight = canvas.height;
                    startX = (canvas.width - drawWidth) / 2;
                    startY = 0;
                }

                ctx.drawImage(video, startX, startY, drawWidth, drawHeight);

                if (currentFilter !== 'none') {
                    ctx.globalCompositeOperation = 'multiply';
                    if (currentFilter === 'red') {
                        ctx.fillStyle = 'rgb(255, 0, 0)';
                    } else if (currentFilter === 'blue') {
                        ctx.fillStyle = 'rgb(0, 0, 255)';
                    }
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(renderLoop);
        }

        document.getElementById('btn-red').onclick = () => currentFilter = 'red';
        document.getElementById('btn-blue').onclick = () => currentFilter = 'blue';
        document.getElementById('btn-none').onclick = () => currentFilter = 'none';
        
        document.body.addEventListener('click', () => {
            if (video.paused) video.play();
        });
    </script>

</body>
</html>
