<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後鏡頭畫面與半透明中央圖片</title>
    <style>
        /* 讓畫面全螢幕且不要有邊界與滾動條 */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100vh;
            overflow: hidden; 
        }

        /* 疊加容器，讓裡面的元素可以相對定位 */
        .camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* 底層：相機畫面 */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 讓相機畫面填滿螢幕 */
            display: block;
        }

        /* 表層：置中的半透明圖片 */
        .center-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* 完美置中的關鍵 */
            
            /* 您可以在這裡調整圖片的大小 */
            width: 250px; /* 控制圖片寬度，可依需求修改數值 */
            max-width: 80%; /* 避免圖片在小螢幕手機上超出邊界 */
            
            /* 【已修改】 0.7 代表 70% 的不透明度 */
            opacity: 0.7; 
            
            pointer-events: none; /* 讓圖片不具備點擊事件，避免干擾 */
            z-index: 10; /* 確保圖片永遠蓋在影片上方 */
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <!-- 自動播放且支援 iOS 的相機畫面 -->
        <video id="video" autoplay playsinline></video>
        
        <!-- 您指定的圖片，請確保 center-img.png 與您上傳到 GitHub 的檔名完全一致 -->
        <img id="centerPic" class="center-image" src="center-img.png" alt="中央圖片">
    </div>

    <script>
        const video = document.getElementById('video');

        // 請求開啟鏡頭。facingMode: 'environment' 為強制呼叫後置主鏡頭
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("無法存取相機，請確認權限", err);
                alert("請允許網頁存取您的相機以使用此功能！");
            });
    </script>

</body>
</html>
